<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pro Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
:root{
  --bg:#0f172a;
  --panel:#111827;
  --user:#2563eb;
  --assistant:#1f2937;
  --border:#1f2937;
  --text:#e5e7eb;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

.sidebar{
  width:280px;
  background:var(--panel);
  padding:20px;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:20px;
}

.sidebar h2{
  font-size:18px;
  font-weight:600;
}

input,select,button,textarea{
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#0b1220;
  color:white;
}

button{
  background:var(--user);
  border:none;
  cursor:pointer;
}

.chat-container{
  flex:1;
  display:flex;
  flex-direction:column;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:30px;
  display:flex;
  flex-direction:column;
  gap:25px;
}

.message{
  display:flex;
  gap:15px;
  max-width:900px;
}

.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#374151;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
}

.bubble{
  padding:15px;
  border-radius:12px;
  background:var(--assistant);
  width:100%;
}

.user .bubble{
  background:var(--user);
}

.chat-input{
  padding:20px;
  border-top:1px solid var(--border);
  display:flex;
  gap:10px;
}

textarea{
  flex:1;
  resize:none;
  height:60px;
}

.typing{
  opacity:0.6;
  font-style:italic;
}
</style>
</head>
<body>

<div class="sidebar">
  <h2>AI Settings</h2>

  <div>
    <label>OpenRouter API Key</label>
    <input type="password" id="apiKey">
  </div>

  <div>
    <label>Model</label>
    <select id="model">
      <option value="openai/gpt-4o">GPT-4o</option>
      <option value="openai/gpt-4-turbo">GPT-4 Turbo</option>
      <option value="anthropic/claude-3-opus">Claude 3 Opus</option>
      <option value="meta-llama/llama-3-70b-instruct">Llama 3 70B</option>
    </select>
  </div>

  <button onclick="clearChat()">Clear Chat</button>
</div>

<div class="chat-container">

  <div class="chat-messages" id="chat"></div>

  <div class="chat-input">
    <textarea id="input" placeholder="Message AI..."></textarea>
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
let messages = JSON.parse(localStorage.getItem("chat_history")) || [];

function saveChat(){
  localStorage.setItem("chat_history",JSON.stringify(messages));
}

function renderMarkdown(text){
  return marked.parse(text);
}

function addMessage(role,content){
  const chat = document.getElementById("chat");

  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.innerText = role === "user" ? "U" : "AI";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = renderMarkdown(content);

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  chat.scrollTop = chat.scrollHeight;

  document.querySelectorAll("pre code").forEach(block=>{
    hljs.highlightElement(block);
  });

  return bubble;
}

function loadHistory(){
  messages.forEach(msg=>{
    addMessage(msg.role,msg.content);
  });
}

function clearChat(){
  messages=[];
  localStorage.removeItem("chat_history");
  document.getElementById("chat").innerHTML="";
}

async function sendMessage(){
  const input = document.getElementById("input");
  const apiKey = document.getElementById("apiKey").value;
  const model = document.getElementById("model").value;

  if(!apiKey) return alert("Enter API key");

  const text = input.value.trim();
  if(!text) return;

  addMessage("user",text);
  messages.push({role:"user",content:text});
  saveChat();

  input.value="";

  const bubble = addMessage("assistant","_AI is typing..._");
  bubble.classList.add("typing");

  try{
    const response = await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+apiKey,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        model:model,
        messages:messages,
        stream:true
      })
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullReply="";

    bubble.innerHTML="";
    bubble.classList.remove("typing");

    while(true){
      const {done,value}=await reader.read();
      if(done) break;

      const chunk = decoder.decode(value);
      const lines = chunk.split("\n");

      for(let line of lines){
        if(line.startsWith("data:")){
          const json=line.replace("data: ","").trim();
          if(json==="[DONE]") break;
          try{
            const parsed=JSON.parse(json);
            const content=parsed.choices?.[0]?.delta?.content;
            if(content){
              fullReply+=content;
              bubble.innerHTML=renderMarkdown(fullReply);
              document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;
              document.querySelectorAll("pre code").forEach(block=>{
                hljs.highlightElement(block);
              });
            }
          }catch{}
        }
      }
    }

    messages.push({role:"assistant",content:fullReply});
    saveChat();

  }catch(err){
    bubble.innerHTML="Error: "+err.message;
  }
}

document.getElementById("input").addEventListener("keydown",function(e){
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

loadHistory();
</script>

</body>
  </html>
