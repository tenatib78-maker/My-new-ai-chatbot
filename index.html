<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOMMA AI – Powered by Gemini</title>
    <style>
        :root {
            --bg: radial-gradient(circle at center, #0f2027, #05080f);
            --container: rgba(0, 15, 30, 0.9);
            --accent: #00fff2;
            --text: #e0ffff;
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        .chat-container {
            width: 95%; max-width: 900px; height: 85vh;
            background: var(--container); border: 1px solid var(--accent);
            border-radius: 15px; display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 255, 242, 0.2); position: relative;
        }

        .header { padding: 15px; text-align: center; border-bottom: 1px solid var(--accent); font-weight: bold; letter-spacing: 2px; }

        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

        .msg { padding: 12px 16px; border-radius: 10px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; }
        .user-msg { align-self: flex-end; background: rgba(0, 255, 242, 0.1); border: 1px solid var(--accent); }
        .ai-msg { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border: 1px solid #444; color: #fff; }

        .input-area { display: flex; padding: 15px; border-top: 1px solid #222; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid var(--accent); color: white; padding: 12px; border-radius: 5px; outline: none; }
        button { background: var(--accent); color: #000; border: none; padding: 0 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* Loading animation */
        .typing { font-size: 0.8em; color: var(--accent); display: none; margin-bottom: 10px; margin-left: 20px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">GOMMA NEURAL INTERFACE</div>
    <div class="messages" id="chatBox">
        <div class="msg ai-msg">Gomma Online. Connection Secure. How can I assist your evolution?</div>
    </div>
    <div id="typingIndicator" class="typing">Gomma is thinking...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask anything..." autocomplete="off">
        <button onclick="askGomma()">SEND</button>
    </div>
</div>

<script>
    // PASTE YOUR API KEY HERE
    const API_KEY = "YOUR_GEMINI_API_KEY_HERE"; 
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const typingIndicator = document.getElementById("typingIndicator");

    async function askGomma() {
        const prompt = userInput.value.trim();
        if (!prompt) return;

        // 1. Add User Message
        appendMessage(prompt, "user-msg");
        userInput.value = "";
        typingIndicator.style.display = "block";

        try {
            // 2. Call Gemini API
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            const aiResponse = data.candidates[0].content.parts[0].text;

            // 3. Add AI Message
            appendMessage(aiResponse, "ai-msg");
        } catch (error) {
            appendMessage("Error: Connection lost. Ensure your API key is correct.", "ai-msg");
            console.error(error);
        } finally {
            typingIndicator.style.display = "none";
        }
    }

    function appendMessage(text, className) {
        const div = document.createElement("div");
        div.className = `msg ${className}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") askGomma(); });
</script>

</body>
</html>
