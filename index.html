<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot - OpenRouter</title>
<style>
  body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 0; }
  #chat-container { width: 90%; max-width: 600px; background: #fff; border-radius: 8px; padding: 20px; margin-top: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  #messages { height: 400px; overflow-y: auto; border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
  .message { padding: 8px 12px; margin: 5px 0; border-radius: 5px; max-width: 80%; }
  .user { background-color: #007bff; color: #fff; align-self: flex-end; }
  .bot { background-color: #e2e2e2; color: #000; align-self: flex-start; }
  #input-container { display: flex; gap: 10px; }
  input, select, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
  button { cursor: pointer; background-color: #007bff; color: #fff; border: none; }
  button:hover { background-color: #0056b3; }
</style>
</head>
<body>

<div id="chat-container">
  <h2>AI Chatbot</h2>
  <div>
    <label for="model-select">Select Model:</label>
    <select id="model-select">
      <option value="gpt-4">GPT-4</option>
      <option value="gpt-3.5">GPT-3.5</option>
      <option value="claude-2">Claude 2</option>
    </select>
  </div>
  <div id="messages"></div>
  <div id="input-container">
    <input type="text" id="user-input" placeholder="Type your message here..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
const messagesContainer = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const modelSelect = document.getElementById('model-select');

const API_KEY = "YOUR_OPENROUTER_API_KEY"; // Replace with your OpenRouter API Key
const API_URL = "https://openrouter.ai/api/v1/chat/completions";

function addMessage(text, sender) {
  const msgDiv = document.createElement('div');
  msgDiv.textContent = text;
  msgDiv.className = 'message ' + sender;
  messagesContainer.appendChild(msgDiv);
  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

async function sendMessage() {
  const message = userInput.value.trim();
  if (!message) return;

  addMessage(message, 'user');
  userInput.value = '';
  const model = modelSelect.value;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: model,
        messages: [{ role: "user", content: message }]
      })
    });

    if (!response.ok) throw new Error(`HTTP error ${response.status}`);
    const data = await response.json();

    // Extract bot message
    const botMessage = data?.choices?.[0]?.message?.content || "No response from model.";
    addMessage(botMessage, 'bot');

  } catch (error) {
    console.error(error);
    addMessage("Error: " + error.message, 'bot');
  }
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>

</body>
</html>
