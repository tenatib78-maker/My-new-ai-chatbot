<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot - OpenRouter</title>
<style>
  body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 0; }
  #chat-container { width: 90%; max-width: 600px; background: #fff; border-radius: 8px; padding: 20px; margin-top: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; }
  #messages { height: 400px; overflow-y: auto; border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
  .message { padding: 8px 12px; margin: 5px 0; border-radius: 5px; max-width: 80%; }
  .user { background-color: #007bff; color: #fff; align-self: flex-end; }
  .bot { background-color: #e2e2e2; color: #000; align-self: flex-start; }
  #input-container { display: flex; gap: 10px; }
  input, select, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
  button { cursor: pointer; background-color: #007bff; color: #fff; border: none; }
  button:hover { background-color: #0056b3; }
  #api-key-container { margin-top: 50px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
</style>
</head>
<body>

<div id="api-key-container">
  <h2>Enter OpenRouter API Key</h2>
  <input type="text" id="api-key-input" placeholder="Your OpenRouter API Key" />
  <button id="save-key-btn">Save API Key</button>
  <p id="api-error" style="color:red;"></p>
</div>

<div id="chat-container">
  <h2>AI Chatbot</h2>
  <div>
    <label for="model-select">Select Model:</label>
    <select id="model-select"></select>
  </div>
  <div id="messages"></div>
  <div id="input-container">
    <input type="text" id="user-input" placeholder="Type your message here..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
let API_KEY = "";
const messagesContainer = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const modelSelect = document.getElementById('model-select');
const chatContainer = document.getElementById('chat-container');
const apiKeyInput = document.getElementById('api-key-input');
const saveKeyBtn = document.getElementById('save-key-btn');
const apiError = document.getElementById('api-error');

const MODELS_API_URL = "https://openrouter.ai/api/v1/models";
const CHAT_API_URL = "https://openrouter.ai/api/v1/chat/completions";

function addMessage(text, sender) {
  const msgDiv = document.createElement('div');
  msgDiv.textContent = text;
  msgDiv.className = 'message ' + sender;
  messagesContainer.appendChild(msgDiv);
  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

// Load available models dynamically
async function loadModels() {
  try {
    const response = await fetch(MODELS_API_URL, {
      headers: { "Authorization": `Bearer ${API_KEY}` }
    });
    if (!response.ok) throw new Error(`HTTP error ${response.status}`);
    const data = await response.json();
    modelSelect.innerHTML = "";
    data.models.forEach(model => {
      const option = document.createElement("option");
      option.value = model.id;
      option.textContent = model.name || model.id;
      modelSelect.appendChild(option);
    });
  } catch (error) {
    apiError.textContent = "Failed to load models. Check your API key.";
    console.error(error);
  }
}

// Save API Key and show chat
saveKeyBtn.addEventListener('click', () => {
  const key = apiKeyInput.value.trim();
  if (!key) {
    apiError.textContent = "API key cannot be empty!";
    return;
  }
  API_KEY = key;
  apiError.textContent = "";
  loadModels().then(() => {
    document.getElementById('api-key-container').style.display = 'none';
    chatContainer.style.display = 'block';
  });
});

// Send user message to API
async function sendMessage() {
  const message = userInput.value.trim();
  if (!message) return;

  addMessage(message, 'user');
  userInput.value = '';
  const model = modelSelect.value;

  try {
    const response = await fetch(CHAT_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: model,
        messages: [{ role: "user", content: message }]
      })
    });

    if (!response.ok) throw new Error(`HTTP error ${response.status}`);
    const data = await response.json();
    const botMessage = data?.choices?.[0]?.message?.content || "No response from model.";
    addMessage(botMessage, 'bot');

  } catch (error) {
    console.error(error);
    addMessage("Error: " + error.message, 'bot');
  }
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

</script>

</body>
</html>
